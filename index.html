<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Webapp</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="app-header">
    <h1>Stock Webapp</h1>
  </header>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="tab-index-fx">지수 · 환율</button>
    <button class="tab-btn" data-tab="tab-ma200">200일선 대시보드</button>
    <button class="tab-btn" data-tab="tab-placeholder-3" disabled>탭 3 (준비중)</button>
  </nav>

  <main class="tab-content-wrap">
    <section id="tab-index-fx" class="tab-panel active">
      <div class="controls">
        <label for="symbolSelect">종목</label>
        <select id="symbolSelect">
          <optgroup label="지수">
            <option value="^KS11">KOSPI</option>
            <option value="^KQ11">KOSDAQ</option>
            <option value="^GSPC">S&amp;P 500</option>
            <option value="^DJI">다우존스</option>
            <option value="^IXIC">나스닥</option>
          </optgroup>
          <optgroup label="환율">
            <option value="USDKRW=X">USD/KRW</option>
            <option value="EURKRW=X">EUR/KRW</option>
            <option value="JPYKRW=X">JPY/KRW</option>
            <option value="CNYKRW=X">CNY/KRW</option>
          </optgroup>
        </select>

        <label for="rangeSelect">기간</label>
        <select id="rangeSelect">
          <option value="1mo">1개월</option>
          <option value="3mo">3개월</option>
          <option value="6mo" selected>6개월</option>
          <option value="1y">1년</option>
          <option value="5y">5년</option>
        </select>

        <button id="loadBtn">조회</button>
      </div>

      <div id="statusMsg" class="status-msg"></div>

      <div class="chart-container">
        <canvas id="priceChart"></canvas>
      </div>
    </section>

    <section id="tab-ma200" class="tab-panel">
      <div class="controls">
        <button id="ma200RefreshBtn">새로고침</button>
        <button id="ma200AddToggleBtn">+ 종목 추가</button>
      </div>

      <div id="ma200AddPanel" class="ma200-add-panel" hidden>
        <div class="ma200-add-row">
          <select id="ma200MarketSelect">
            <option value="kr">한국 (네이버)</option>
            <option value="us">미국 (야후 파이낸스)</option>
          </select>
          <input type="text" id="ma200SearchInput" placeholder="종목명 검색 또는 코드/티커 직접 입력">
          <button id="ma200SearchBtn">검색</button>
          <button id="ma200DirectAddBtn">코드/티커로 바로 추가</button>
        </div>
        <div id="ma200SearchResults" class="ma200-search-results"></div>
        <div id="ma200AddMsg" class="ma200-add-msg"></div>
      </div>

      <div id="ma200StatusMsg" class="status-msg"></div>

      <div id="ma200Cards" class="stock-cards"></div>
    </section>

    <section id="tab-placeholder-3" class="tab-panel">
      <p class="placeholder-text">추후 작성 예정입니다.</p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
